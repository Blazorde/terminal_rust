name: Feature request
description: Suggest an improvement or a new capability
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: >
        Describe one feature per issue and focus on the user problem it would
        solve.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to do, and what is difficult today?
      placeholder: As a user, I want to ... because ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention any workaround or alternative you have considered.
    validations:
      required: false
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: List concrete outcomes that would make this feature complete.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: false
