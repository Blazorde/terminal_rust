name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Prepare bundled Git runtime
        uses: ./.github/actions/prepare-git-runtime

      - name: Build desktop frontend
        run: npm run build --prefix desktop

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check compilation
        run: cargo check --all-targets --all-features

      - name: Check desktop compilation
        run: cargo check -p terminal-rust-desktop --all-targets --all-features

      - name: Check plugin SDK and template compilation
        run: cargo check -p terminal-rust-plugin-sdk -p terminal-rust-example-plugin --all-targets --all-features

      - name: Run clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run desktop clippy
        run: cargo clippy -p terminal-rust-desktop --all-targets --all-features -- -D warnings

      - name: Run plugin SDK and template clippy
        run: cargo clippy -p terminal-rust-plugin-sdk -p terminal-rust-example-plugin --all-targets --all-features -- -D warnings

      - name: Run unit and integration tests
        run: cargo test --all-targets --all-features

      - name: Run desktop tests
        run: cargo test -p terminal-rust-desktop --all-targets --all-features

      - name: Run plugin SDK and template tests
        run: cargo test -p terminal-rust-plugin-sdk -p terminal-rust-example-plugin --all-targets --all-features

      - name: Validate Unix installer syntax
        if: runner.os != 'Windows'
        shell: sh
        run: sh -n scripts/install.sh

      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

  required-ci:
    name: Required CI gate
    runs-on: ubuntu-latest
    needs:
      - rust
    if: always()

    steps:
      - name: Require all Rust checks
        shell: bash
        env:
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          set -euo pipefail

          if [[ "${RUST_RESULT}" != "success" ]]; then
            echo "::error::Required Rust checks did not all pass. Result: ${RUST_RESULT}"
            exit 1
          fi

          echo "All required Rust checks passed."
