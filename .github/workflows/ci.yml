name: CI

on:
  pull_request:
    branches:
      - main
      - develop
  push:
    branches:
      - main
      - develop

permissions:
  contents: read

# A new push to a pull request replaces its running checks. Every push to main or
# develop gets its own group, so it is never cancelled nor left pending.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable branch
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Validate Unix installer syntax
        if: runner.os != 'Windows'
        shell: sh
        run: sh -n scripts/install.sh

      - name: Validate Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1),
            [ref]$null,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

      - name: Check compilation
        run: cargo check --all-targets --all-features --locked

      - name: Check plugin SDK and template compilation
        run: cargo check -p terminal-rust-plugin-sdk -p terminal-rust-example-plugin --all-targets --all-features --locked

      - name: Run clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run plugin SDK and template clippy
        run: cargo clippy -p terminal-rust-plugin-sdk -p terminal-rust-example-plugin --all-targets --all-features --locked -- -D warnings

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install desktop dependencies
        run: npm ci --prefix desktop

      - name: Build desktop frontend
        run: npm run build --prefix desktop

      - name: Run desktop frontend tests
        run: npm test --prefix desktop

      - name: Prepare bundled Git and editor runtime
        uses: ./.github/actions/prepare-git-runtime

      - name: Check desktop compilation
        run: cargo check -p terminal-rust-desktop --all-targets --all-features --locked

      - name: Run desktop clippy
        id: desktop_clippy
        run: cargo clippy -p terminal-rust-desktop --all-targets --all-features --locked -- -D warnings

      - name: Run unit and integration tests
        run: cargo test --all-targets --all-features --locked --no-fail-fast

      - name: Run desktop tests
        if: ${{ !cancelled() && steps.desktop_clippy.outcome == 'success' }}
        env:
          TERMINAL_RUST_REQUIRE_BUNDLED_GIT_TEST: "1"
        run: cargo test -p terminal-rust-desktop --all-targets --all-features --locked --no-fail-fast

      - name: Run plugin SDK and template tests
        if: ${{ !cancelled() && steps.desktop_clippy.outcome == 'success' }}
        run: cargo test -p terminal-rust-plugin-sdk -p terminal-rust-example-plugin --all-targets --all-features --locked --no-fail-fast

  required-ci:
    name: Required CI gate
    runs-on: ubuntu-latest
    needs:
      - rust
    if: always()

    steps:
      - name: Require all Rust checks
        shell: bash
        env:
          RUST_RESULT: ${{ needs.rust.result }}
        run: |
          set -euo pipefail

          if [[ "${RUST_RESULT}" != "success" ]]; then
            echo "::error::Required Rust checks did not all pass. Result: ${RUST_RESULT}"
            exit 1
          fi

          echo "All required Rust checks passed."
