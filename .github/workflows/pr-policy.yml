name: PR policy

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - ready_for_review
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  validate-pr-route:
    name: Required PR policy gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout trusted policy files
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.base_ref }}

      - name: Enforce branch flow
        shell: bash
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          # Character ranges below must mean ASCII only, whatever the runner locale.
          export LC_ALL=C

          echo "Base branch: ${BASE_BRANCH}"
          echo "Head branch: ${HEAD_BRANCH}"
          echo "Actor: ${ACTOR}"

          if grep -Eiq "^[[:space:]]*${ACTOR}[[:space:]]*$" .github/bypass-owners.txt; then
            echo "Actor ${ACTOR} is listed in .github/bypass-owners.txt; PR policy gate is bypassed."
            exit 0
          fi

          allowed_work_branch_regex='^(feat|fix|chore|refactor|hotfix)/[a-z0-9][a-z0-9._-]*$'
          # Dependabot always creates lowercase "dependabot/<ecosystem>/<directory>/<name>"
          # branches, where names may keep upstream capitals ("EmbarkStudios") and
          # may contain "." and "+". A dot must be followed by another character,
          # which rules out "..", leading dots and trailing dots in a segment.
          dependabot_branch_regex='^dependabot/[A-Za-z0-9][A-Za-z0-9+_-]*(\.[A-Za-z0-9+_-]+)*(/[A-Za-z0-9][A-Za-z0-9+_-]*(\.[A-Za-z0-9+_-]+)*)*$'

          if [[ "${BASE_BRANCH}" == "main" ]]; then
            if [[ "${HEAD_BRANCH}" != "develop" ]]; then
              echo "::error::main only accepts pull requests from develop."
              exit 1
            fi
            exit 0
          fi

          if [[ "${BASE_BRANCH}" == "develop" ]]; then
            if [[ "${HEAD_BRANCH}" =~ ${allowed_work_branch_regex} ]]; then
              exit 0
            fi
            if [[ "${HEAD_BRANCH}" =~ ${dependabot_branch_regex} && "${HEAD_BRANCH}" != *.lock && "${HEAD_BRANCH}" != *.lock/* ]]; then
              exit 0
            fi
            echo "::error::develop only accepts PRs from feat/*, fix/*, chore/*, refactor/*, or hotfix/* branches (dependabot/* is reserved for Dependabot)."
            exit 1
          fi

          echo "::error::Pull requests are only allowed into main or develop."
          exit 1
