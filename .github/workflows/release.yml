name: Release builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked -p terminal_rust --bin terminal_rust

      - name: Smoke test release binary
        if: runner.os != 'Windows'
        run: ./target/release/terminal_rust help

      - name: Smoke test release binary on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\target\release\terminal_rust.exe help

      - name: Stage release files
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/package
          cp target/release/terminal_rust LICENSE README.md CHANGELOG.md dist/package/
          cp -R config dist/package/config

      - name: Stage release files on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist\package -Force | Out-Null
          Copy-Item target\release\terminal_rust.exe, LICENSE, README.md, CHANGELOG.md -Destination dist\package
          Copy-Item config -Destination dist\package\config -Recurse

      - name: Package Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: tar -czf "terminal_rust-linux-${{ runner.arch }}.tar.gz" -C dist/package .

      - name: Package macOS binary
        if: runner.os == 'macOS'
        shell: bash
        run: tar -czf "terminal_rust-macos-${{ runner.arch }}.tar.gz" -C dist/package .

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist\package\* -DestinationPath "terminal_rust-windows-${{ runner.arch }}.zip"

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: terminal_rust-linux-${{ runner.arch }}
          path: terminal_rust-linux-${{ runner.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v7
        with:
          name: terminal_rust-macos-${{ runner.arch }}
          path: terminal_rust-macos-${{ runner.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: terminal_rust-windows-${{ runner.arch }}
          path: terminal_rust-windows-${{ runner.arch }}.zip
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release metadata
        uses: actions/checkout@v7

      - name: Download packaged binaries
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Extract version notes
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
            END { if (!found) exit 1 }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Terminal Rust $GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --latest
