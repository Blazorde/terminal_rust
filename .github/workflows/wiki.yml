name: Publish wiki

on:
  push:
    branches:
      - develop
    paths:
      - "wiki/**"
      - "scripts/sync-wiki.mjs"
      - ".github/workflows/wiki.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-wiki
  cancel-in-progress: true

jobs:
  publish:
    name: Synchronize repository wiki mirror
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate and publish wiki
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync-wiki.mjs --publish
