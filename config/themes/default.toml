version = 1
name = "default"

[palette]
primary = "cyan"
secondary = "magenta"
success = "green"
warning = "yellow"
error = "red"
muted = "white"

[segments.path]
foreground = "primary"
icon = "folder"
fallback = ""

[segments.git]
foreground_clean = "success"
foreground_dirty = "warning"
icon = "git_branch"
fallback = "git:"

[segments.symbol]
foreground = "secondary"
value = ">"
