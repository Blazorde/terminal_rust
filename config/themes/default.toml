version = 1
name = "default"

[palette]
path = "cyan"
git_clean = "green"
git_dirty = "yellow"
symbol = "white"

[segments.path]
foreground = "path"
icon = "folder"
fallback = ""

[segments.git]
foreground_clean = "git_clean"
foreground_dirty = "git_dirty"
icon = "git_branch"
fallback = "git:"

[segments.symbol]
foreground = "symbol"
value = ">"
