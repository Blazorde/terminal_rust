[package]
name = "terminal_rust"
version = "0.3.0"
edition = "2024"
description = "Mini shell Rust for developers on macOS, Linux, and Windows. A simple command-line interface for executing commands and managing files."
readme = "README.md"
license = "MIT"
repository = "https://github.com/Blazorde/terminal_rust"
homepage = "https://github.com/Blazorde/terminal_rust"
keywords = ["shell", "terminal", "rust", "multiplatform", "git"]
categories = ["command-line-utilities"]

[workspace]
members = ["desktop/src-tauri"]
resolver = "2"

[dependencies]
jiff = "0.2.38"
rustyline = "18.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = { version = "1.0", features = ["serde"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["disk", "network", "system"] }
toml = "0.9"
