[package]
name = "terminal_rust"
version = "1.9.1"
edition = "2024"
rust-version = "1.95"
description = "Mini shell Rust for developers on macOS, Linux, and Windows. A simple command-line interface for executing commands and managing files."
readme = "README.md"
license = "MIT"
repository = "https://github.com/Blazorde/terminal_rust"
homepage = "https://github.com/Blazorde/terminal_rust"
keywords = ["shell", "terminal", "rust", "multiplatform", "git"]
categories = ["command-line-utilities"]

[features]
default = []

[workspace]
members = [
    "crates/terminal-rust-plugin-sdk",
    "desktop/src-tauri",
    "desktop/native-prototype",
    "plugins/example-plugin",
]
resolver = "2"

[dependencies]
crossterm = "0.29"
ctrlc = "3"
jiff = "0.2.38"
rustyline = { version = "19.0.0", features = ["buffer-redux"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = { version = "1.0", features = ["serde"] }
sysinfo = { version = "0.39.6", default-features = false, features = ["disk", "network", "system"] }
toml = "1.1"
unicode-width = "0.2"

# Job control (Ctrl+Z, fg, bg): process groups and the controlling terminal, through
# APIs that need no `unsafe` code on our side.
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["signal"] }
signal-hook = { version = "0.3", default-features = false }
rustix = { version = "1.1", default-features = false, features = ["std", "process", "termios"] }
