[package]
name = "terminal-rust-desktop"
version = "1.0.0-alpha.1"
description = "Desktop interface for Terminal Rust"
edition = "2024"
license = "MIT"
repository = "https://github.com/Blazorde/terminal_rust"

[lib]
name = "terminal_rust_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "terminal-rust-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
flate2 = "1.1"
portable-pty = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tar = "0.4"
tauri = { version = "2.12.2", features = [] }
terminal_rust = { path = "../.." }
